services:
  db:
    image: pgvector/pgvector:pg16
    container_name: service-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-serviceagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serviceagent}
      POSTGRES_DB: ${POSTGRES_DB:-serviceagent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serviceagent} -d ${POSTGRES_DB:-serviceagent}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
